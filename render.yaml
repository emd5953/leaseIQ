services:
  # Main API Backend
  - type: web
    name: leaseiq-api
    env: node
    buildCommand: chmod +x scripts/render-build.sh && ./scripts/render-build.sh
    startCommand: node dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REDUCTO_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_GEOCODING_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: INTERNAL_JOB_TOKEN
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # Alert worker every 15 minutes, offset from scraping. Delivery obeys each search's preferences.
  - type: cron
    name: leaseiq-alerts
    env: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/jobs/alert-cron.js
    schedule: "3,18,33,48 * * * *"
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false

  # Scraping every 15 minutes. Source access, freshness and provider budgets must be monitored.
  - type: cron
    name: leaseiq-scraping
    env: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/jobs/scraping-cron.js
    schedule: "*/15 * * * *"
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: MONGODB_URI
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: GOOGLE_GEOCODING_API_KEY
        sync: false
